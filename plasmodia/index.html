#gizmos .giz { color: var(--c); }
#gizmos .vis { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; opacity: .85; }
#gizmos .vis.fill { fill: currentColor; fill-opacity: .08; }
#gizmos .hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
#gizmos .giz.sel .vis { opacity: 1; filter: drop-shadow(0 0 4px currentColor); }
#gizmos .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
#gizmos .barrier .vis { stroke-width: 1; stroke-dasharray: 4 4; opacity: .6; }
#gizmos .barrier.sel .vis { opacity: 1; }
#gizmos .barrier .hit { stroke-width: 16; }
#gizmos .link { stroke: #c9b6ff; stroke-width: 1.5; stroke-dasharray: 2 6; stroke-linecap: round; opacity: .7; }
#gizmos .link.off { opacity: .25; }
#gizmos .handle { fill: #fff; stroke: currentColor; stroke-width: 2; pointer-events: all; cursor: grab; }
#gizmos text { fill: currentColor; font: 600 11px system-ui, sans-serif; paint-order: stroke; stroke: rgba(0,0,0,.6); stroke-width: 3px; }
/* With a mouse the gizmos fade out after 2 s without movement, like the pointer mark and the tools handle, even while a
   placing tool or a selection is active. Hidden at the end of the fade, so invisible handles can't be grabbed. Not on touch. */
@media (hover: hover) { body.idle #gizmos { opacity: 0; visibility: hidden; transition: opacity .8s, visibility 0s linear .8s; } }

/* Debug overlay (D) */
#overlay { display: none; margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(5,6,10,.6); font-size: 11.5px;
  font-variant-numeric: tabular-nums; min-width: 150px; }
#overlay .dot { width: 8px; height: 8px; margin-right: 6px; }
#overlay i { color: var(--muted); font-style: normal; margin-left: 4px; }
#overlay .sub { color: var(--muted); margin-top: 3px; }
body.hide-ui #overlay { opacity: 1; }

</style>

// The sum of the trail around a sensor, each species' channel weighted by this species' row of the matrix.
fn sense(pos: vec2f, angle: f32, dist: f32, size: i32, w: vec4f) -> f32 {
  let c = vec2i(floor(pos + vec2f(cos(angle), sin(angle)) * dist));

  // (only compared between the three sensors, so its scale doesn't matter) for about a third of the reads.
  let stride = select(1, 2, size >= 3);

  for (var oy = -size; oy <= size; oy += stride) {

fn segmentsCross(p: vec2f, q: vec2f, a: vec2f, b: vec2f) -> bool {

  let den = r.x * s.y - r.y * s.x;
  if (abs(den) < 1e-6) { return false; }
  let ap = a - p;
  let t = (ap.x * s.y - ap.y * s.x) / den;
  let u = (ap.x * r.y - ap.y * r.x) / den;
  return t >= 0.0 && t <= 1.0 && u >= 0.0 && u <= 1.0;

  var CSS2 = `
.pg-root { width: 100%; display: flex; flex-direction: column; gap: 4px; }
.pg-canvas { display: block; width: 100%; }
.pg-legend { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 10px; line-height: 1.4; font-variant-numeric: tabular-nums; }
.pg-item { display: flex; align-items: center; gap: 4px; min-width: 0; }

`;
  var PAD_X = 6;
  var PAD_Y = 12;
  function round1(x) {
    const r = Math.round(x * 10) / 10;
    return Number.isInteger(r) ? String(r) : r.toFixed(1);
  }
  function fmtNum2(n) {
    if (!Number.isFinite(n)) return "—";
    const a = Math.abs(n);
    if (a >= 999500) return `${round1(n / 1e6)}M`;
    if (a >= 1e3) return `${round1(n / 1e3)}k`;

  function fmtSpan(sec) {

  }
  function populationGraph(opts = {}) {
    const height = Math.max(40, opts.height ?? 120);
    const capacity = Math.max(2, Math.floor(opts.capacity ?? 900));
    const el2 = document.createElement("div");
    el2.className = "pg-root";
    const canvas3 = document.createElement("canvas");
    canvas3.className = "pg-canvas";
    canvas3.style.height = `${height}px`;
    const legend = document.createElement("div");
    legend.className = "pg-legend";
    el2.append(canvas3, legend);
    const ctx = canvas3.getContext("2d");
    const buf = new Array(capacity);
    let head = 0;
    let count2 = 0;
    let series = [];
    let legendVals = [];
    let rafId = 0;
    let cw = 0;
    let chh = 0;
    let cdpr = 0;
    const at = (i) => buf[(head + i) % capacity];
    function buildLegend() {
      legend.textContent = "";
      legendVals = series.map((s) => {
        const item = document.createElement("div");
        item.className = "pg-item";
        const dot = document.createElement("span");
        dot.className = "pg-dot";
        if (s.dashed) dot.style.border = `1.5px solid ${s.colour}`;
        else dot.style.background = s.colour;
        const label2 = document.createElement("span");
        label2.className = "pg-label";
        label2.textContent = s.label;
        const val = document.createElement("span");
        val.className = "pg-val";
        val.textContent = "—";
        item.append(dot, label2, val);
        legend.append(item);
        return val;
      });
    }
    function updateLegend(latest) {
      for (let i = 0; i < legendVals.length; i++) legendVals[i].textContent = fmtNum2(latest[i]);
    }
    function schedule() {
      if (!rafId) rafId = requestAnimationFrame(() => {
        rafId = 0;
        draw();
      });
    }
    function draw() {
      if (el2.offsetParent === null) return;
      const w = Math.round(el2.clientWidth);
      if (!w) return;
      const dpr = window.devicePixelRatio || 1;
      const pw = Math.round(w * dpr);
      const ph = Math.round(height * dpr);
      if (pw !== cw || ph !== chh || dpr !== cdpr) {
        canvas3.width = pw;
        canvas3.height = ph;
        cw = pw;
        chh = ph;
        cdpr = dpr;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, height);
      const x0 = PAD_X;
      const x1 = w - PAD_X;
      const y0 = PAD_Y;
      const y1 = height - PAD_Y;
      const plotW = Math.max(1, x1 - x0);
      const plotH = Math.max(1, y1 - y0);
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(255,255,255,.08)";
      ctx.strokeRect(0.5, 0.5, w - 1, height - 1);
      ctx.strokeStyle = "rgba(255,255,255,.05)";
      ctx.beginPath();
      for (let k = 1; k <= 3; k++) {
        const gy = Math.round(y0 + plotH * k / 4) + 0.5;
        ctx.moveTo(x0, gy);
        ctx.lineTo(x1, gy);
      }
      ctx.stroke();
      const latest = series.map((_, i) => count2 ? at(count2 - 1).v[i] : NaN);
      updateLegend(latest);
      if (count2 < 2) return;
      let maxV = 0;
      for (let i = 0; i < count2; i++) {
        const v = at(i).v;
        for (let j = 0; j < v.length; j++) if (Number.isFinite(v[j]) && v[j] > maxV) maxV = v[j];
      }
      const ymax = Math.max(1, maxV * 1.1);
      const t03 = at(0).t;
      const span = Math.max(1e-6, at(count2 - 1).t - t03);
      for (let si = 0; si < series.length; si++) {
        const s = series[si];
        ctx.strokeStyle = s.colour;
        ctx.lineWidth = 1.5;
        ctx.lineJoin = "round";
        ctx.setLineDash(s.dashed ? [4, 3] : []);
        ctx.beginPath();
        for (let i = 0; i < count2; i++) {
          const smp = at(i);
          const v = Number.isFinite(smp.v[si]) ? smp.v[si] : 0;
          const x = x0 + (smp.t - t03) / span * plotW;
          const y = y1 - v / ymax * plotH;
          if (i) ctx.lineTo(x, y);
          else ctx.moveTo(x, y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
        const lv = latest[si];
        if (Number.isFinite(lv)) {
          ctx.fillStyle = s.colour;
          ctx.beginPath();
          ctx.arc(x1, y1 - lv / ymax * plotH, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.font = "10px system-ui, -apple-system, sans-serif";
      ctx.fillStyle = "rgba(233,235,241,.7)";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(fmtNum2(ymax), 4, 1);
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.fillText(fmtSpan(span), w - 4, height - 1);
    }
    function push(t, values) {
      buf[(head + count2) % capacity] = { t, v: Array.isArray(values) ? values.slice() : [] };
      if (count2 < capacity) count2++;
      else head = (head + 1) % capacity;
      schedule();
    }
    function setSeries(next2) {
      series = (next2 || []).map((s) => ({
        label: String(s.label ?? ""),
        colour: s.colour || "#9aa0b0",
        dashed: !!s.dashed
      }));
      buildLegend();
      schedule();
    }
    function clear() {
      head = 0;
      count2 = 0;
      schedule();
    }
    function redraw() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = 0;
      }
      draw();
    }
    const ro = new ResizeObserver(schedule);
    ro.observe(el2);
    buildLegend();
    return { el: el2, push, setSeries, clear, redraw };
  }

    if (e.target.closest(".step, .card")) e.target.closest("button").blur();

  setTimeout(() => bar.classList.add("can-fade"), 1e4);

  // src/main.js

    const mask = paintWalls(S.world.barriers, w, h, wrapping());

    rebuild(w, h, data, alive, mask);

    resetStats();

    resetPacing();

  }
  function refreshWalls() {

  on("reset", restart);
  on("world", () => {

    drawGizmos(true);

  on("replaced", () => buildTools());

      placeBrush(pointer.x, pointer.y);
    }
  });
  var pace = { budget: 6, vsync: 1e3 / 60, ms: 0, frames: 0, steps: 0, capped: false, hold: 0, cut: null, probed: false };
  function resetPacing() {

      frameBody(now);

      log.error("Frame error: " + (e && e.stack || e));
    }
  }
  function frameBody(now) {
    if (!sim.ready) return;
    const frameMs = lastNow ? now - lastNow : 0;

    lastNow = now;

    if (!paused) {

      if (steps > pace.budget) {

        simAcc = 0;
        pace.capped = true;
      } else simAcc -= steps * stepSeconds();

      pendingSteps -= steps;
    }

    if (revealBoost !== 1) for (let i = 0; i < 4; i++) sim.params.set(`species.${i}.deposit`, sim.params.get(`species.${i}.deposit`) * revealBoost);

    writeUniforms();
    revealBoost = 1;
    const enc = sim.device.createCommandEncoder();
    encodeSteps(enc, steps, { keepDeposits: S.debug.view === "deposits" });
    encodeRender(enc, S.look);
    sim.device.queue.submit([enc.finish()]);

      fpsTime = now;

  function presetRange(key) {
